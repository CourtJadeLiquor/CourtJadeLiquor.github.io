<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="{{ '/assets/avatar.jpg' | relative_url }}" alt="宫廷玉液酒头像" width="30" height="30">
      <span>宫廷玉液酒 · CourtJadeLiquor</span>
    </div>
    <div class="footer-links">
      {% for item in site.nav %}
        {% if item.title != '首页' %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endif %}
      {% endfor %}
    </div>
    <div class="footer-meta">
      <span>系统 · 智能 · 策略 · 算子</span>
      <span>构建时间 {{ site.build_metadata.date }} · 版本 {{ site.build_metadata.version }}</span>
    </div>
  </div>
</footer>
