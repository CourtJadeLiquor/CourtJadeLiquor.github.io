<div class="progress"></div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/avatar.jpg' | relative_url }}" alt="宫廷玉液酒头像" width="38" height="38">
      <span class="brand-text">
        <span class="brand-name">宫廷玉液酒</span>
        <span class="brand-sub">CourtJadeLiquor</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="展开导航">☰</button>
    <nav class="nav">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    {% include github-link.html url=site.github_url class="github-link" label="GitHub 个人主页" %}
  </div>
</header>
