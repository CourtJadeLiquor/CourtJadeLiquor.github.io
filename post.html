<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 宫廷玉液酒</title>
<meta name="description" content="宫廷玉液酒博客文章，支持 Markdown、LaTeX 与 Mermaid UML。">
<link rel="icon" href="assets/avatar.jpg">
<script>(function(){try{var t=localStorage.getItem('cjl-theme');if(t==='dark'||t==='github'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="post">
<header class="site-header">
  <div class="progress"></div>
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img src="assets/avatar.jpg" alt="宫廷玉液酒头像" width="38" height="38">
      <span class="brand-text">
        <span class="brand-name">宫廷玉液酒</span>
        <span class="brand-sub">CourtJadeLiquor</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="展开导航">☰</button>
    <nav class="nav"><a href="index.html">首页</a><a href="columns.html">专栏</a><a href="topics.html">专题</a><a href="posts.html" class="active">博客</a><a href="about.html">关于</a></nav>
  </div>
</header>
<main>
<article>
  <div class="article-head">
    <div class="container">
      <div class="crumbs">
        <a href="index.html">首页</a><span class="sep">/</span>
        <a href="posts.html">博客</a><span class="sep">/</span>
        <span id="crumbTitle">文章</span>
      </div>
      <h1 id="postTitle">文章加载中…</h1>
      <div class="article-meta" id="postMeta"></div>
      <div class="post-tags" id="postTags" style="margin-top:14px"></div>
    </div>
  </div>
  <div class="container article-layout">
    <div class="prose" id="postContent"></div>
    <aside class="toc" id="postToc" hidden></aside>
  </div>
</article>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="assets/avatar.jpg" alt="宫廷玉液酒头像" width="30" height="30">
      <span>宫廷玉液酒 · CourtJadeLiquor</span>
    </div>
    <div class="footer-links">
      <a href="columns.html">专栏</a>
      <a href="topics.html">专题</a>
      <a href="posts.html">博客</a>
      <a href="about.html">关于</a>
    </div>
    <div class="footer-meta">系统 · 智能 · 策略 · 算子</div>
  </div>
</footer>
<script src="assets/vendor/markdown-it/markdown-it.min.js"></script>
<script src="assets/vendor/katex/katex.min.js"></script>
<script src="assets/vendor/mermaid/mermaid.min.js"></script>
<script src="assets/render.js"></script>
<script src="assets/main.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';

  var slug = new URLSearchParams(window.location.search).get('slug') || '';
  var contentEl = document.getElementById('postContent');
  var tocEl = document.getElementById('postToc');
  var metaEl = document.getElementById('postMeta');
  var tagsEl = document.getElementById('postTags');
  var titleEl = document.getElementById('postTitle');
  var crumbEl = document.getElementById('crumbTitle');
  var current = null;

  function buildToc() {
    var heads = contentEl.querySelectorAll('h2, h3');
    if (!heads.length) { tocEl.hidden = true; return; }
    tocEl.hidden = false;
    tocEl.textContent = '';
    var label = document.createElement('div');
    label.className = 'toc-title';
    label.textContent = '目录';
    tocEl.appendChild(label);
    Array.prototype.forEach.call(heads, function (head, index) {
      head.id = 'sec-' + (index + 1);
      var a = document.createElement('a');
      a.href = '#' + head.id;
      a.textContent = head.textContent;
      if (head.tagName === 'H3') a.className = 'lv3';
      tocEl.appendChild(a);
    });
  }

  function renderMeta(post) {
    metaEl.textContent = '';
    var author = document.createElement('span');
    author.textContent = '作者 · ' + (post.author || '澄空');
    var date = document.createElement('span');
    date.textContent = new Date(post.updatedAt).toLocaleString('zh-CN', { hour12: false });
    var stack = document.createElement('span');
    stack.textContent = 'Markdown · LaTeX · Mermaid';
    metaEl.appendChild(author);
    metaEl.appendChild(document.createTextNode('·'));
    metaEl.appendChild(date);
    metaEl.appendChild(document.createTextNode('·'));
    metaEl.appendChild(stack);

    if (window.CJLApp && CJLApp.user && CJLApp.user.role === 'admin') {
      var edit = document.createElement('a');
      edit.href = 'editor.html?slug=' + encodeURIComponent(post.slug);
      edit.textContent = '编辑本文';
      metaEl.appendChild(document.createTextNode('·'));
      metaEl.appendChild(edit);
    }

    tagsEl.textContent = '';
    (post.tags || []).forEach(function (tag) {
      var chip = document.createElement('span');
      chip.className = 'post-tag';
      chip.textContent = tag;
      tagsEl.appendChild(chip);
    });
  }

  function fail(message) {
    titleEl.textContent = '文章无法显示';
    contentEl.innerHTML = '<p>' + CJLRender.escapeHtml(message) + '</p><p><a href="posts.html">← 返回博客列表</a></p>';
  }

  if (!slug) {
    fail('缺少文章标识');
    return;
  }

  CJLApp.api('/api/posts/' + encodeURIComponent(slug)).then(function (data) {
    current = data.post;
    document.title = current.title + ' · 宫廷玉液酒';
    titleEl.textContent = current.title;
    crumbEl.textContent = current.title;
    renderMeta(current);
    CJLRender.mount(contentEl, current.content || '');
    buildToc();
    document.body.setAttribute('data-thread', 'post:' + current.slug);
    CJLApp.mountComments();
  }).catch(function (err) {
    fail(err.message);
  });

  CJLApp.onAuth(function () {
    if (current) renderMeta(current);
  });
})();
</script>
</body>
</html>
